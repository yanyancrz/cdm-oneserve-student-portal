  <path d="M240 322h34M240 334h26" stroke="#0E5A34" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 300c14-10 30-14 44-12M328 314c-12 8-26 12-38 12" stroke="#6DB33F" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- GCAS wordmark -->
